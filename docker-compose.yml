version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: commerceops-postgres
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops
    ports:
      - "5432:5432"
    volumes:
      - commerceops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops -d commerceops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commerceops-redis
    ports:
      - "6379:6379"
    volumes:
      - commerceops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  commerceops_postgres_data:
  commerceops_redis_data:
